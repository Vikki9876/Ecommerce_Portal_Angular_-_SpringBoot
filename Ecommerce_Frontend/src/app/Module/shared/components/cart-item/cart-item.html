<div class="p-5 shadow-lg">
    <div class="flex items-center">
        <div class="w-20 h-20 lg:w-36 lg:h-36">
            <img class="w-full h-full object-cover object-top "
             [src]='cartItem.product.imageUrl' 
             alt="">
        </div>
        <div class="ml-5 space-y-1">
            <p class="font-semibold">{{cartItem.product.title}}</p>
            <p class="text-gray-500 ">Size :  {{cartItem.size}} Black</p>
            <p class="text-gray-500 mt-2">Seller : {{cartItem.brand}} </p>
            <div class="flex space-x-2 items-center pt-3">
                <p class="text-gray-500 line-through ">{{cartItem.product.price}}</p>
                <p class="font-semibold text-lg"> {{cartItem.product.discountedPrice}}</p>
                <p class="text-green-600 font-semibold">{{cartItem.product.discountedPercent}}%</p>
            </div>
        </div>
        <div *ngIf="showButton" class="flex items-center lg:space-x-10 pt-4 justify-between">
            <div class="flex items-center space-x-2">
                <div class="example-button-container">
                    <button mat-mini-fab color="accent" (click)="updateCartItem(-1)" [disabled]="cartItem.quantity===1">
                        <mat-icon>remove</mat-icon>
                    </button>
                </div>

                <span class="py-1 px-7 border border-gray-800 rounded-b-sm">{{cartItem.quantity}}</span>
                <div class="example-button-container">

                    <button mat-mini-fab color="accent" (click)="updateCartItem(1)">
                        <mat-icon>add</mat-icon>
                    </button>
                </div>
                <button (click)="removeCartItem()" color="accent" mat-stroked-button>Remove</button>
            </div>
        </div>
    </div>
</div>
