<div class="p-5 lg:p-20 text-gray-800">
  <h1 class="text-2xl font-bold text-center py-10 text-white">My Orders</h1>
  
  <div class="lg:grid grid-cols-4 gap-5">
    
    <div class="col-span-1 text-white p-4 rounded-lg shadow-sm mb-5 lg:mb-0 h-fit">
      <h2 class="text-white font-semibold mb-3 text-sm uppercase tracking-wider">Filter Status</h2>
      <div class="space-y-2">
        <div *ngFor="let option of orderFilter" class="flex items-center">
          <mat-checkbox 
            [id]="option.value" 
            [value]="option.value"
            (change)="onFilterChange($event, option.value)">
            <span class="text-sm text-white font-medium">
              {{ option.label }}
            </span>
          </mat-checkbox>
        </div>
      </div>
    </div>
    
    <div class="col-span-3 space-y-5">
      <div *ngFor="let item of orders()">
        <app-order-card [orderData]="item" ngSkipHydration />
      </div>

      <div *ngIf="orders().length === 0" class="text-center py-10 text-white rounded-lg border border-dashed">
        <p class="text-base font-medium text-white">No orders found.</p>
        <p class="text-xs text-white mt-1">Try adjusting your status filter filters.</p>
      </div>
    </div>

  </div>
</div>
