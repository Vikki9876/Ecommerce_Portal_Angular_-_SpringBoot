<div class="grid grid-cols-1 gap-4 lg:grid-cols-12 px-5 lg:px-20">
    <div class="col-span-1 lg:col-span-5">
        <div class="rounded-md shadow-md h-[32.2rem] overflow-y-scroll hide-scrollbar box py-5">
            <div class="p-5 py-7 cursor-pointer">
                <div *ngFor="let item of adresses; let last=last" class="py-2 space-y-2">
                    <app-address-card [address]="item" />
                    
                    <button style="padding: 1.6rem;" mat-raised-button color="accent" 
                            (click)="handleCreateOrder(item)">
                        Deliver Here
                    </button>
                    
                    <mat-divider *ngIf="!last" class="mt-4"></mat-divider>
                </div> 
            </div>
        </div>
    </div>

    <div class="col-span-1 lg:col-span-7">
        <div class="rounded-b-md shadow-md p-5 box">
       
          <form [formGroup]="myForm" (ngSubmit)="handleSubmit()">
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    
                    <div class="col-span-1">
                        <mat-form-field appearance="fill" class="w-full">
                            <mat-label>First Name</mat-label>
                            <input matInput formControlName="firstName">
                        </mat-form-field>
                    </div>      

                    <div class="col-span-1">
                        <mat-form-field appearance="fill" class="w-full">
                            <mat-label>Last Name</mat-label>
                            <input matInput formControlName="lastName">
                        </mat-form-field>
                    </div>
   
                    <div class="col-span-2"> <mat-form-field appearance="fill" class="w-full">
                            <mat-label>Address</mat-label>
                            <textarea matInput formControlName="streetAddress" rows="4"></textarea>
                        </mat-form-field>
                    </div>

                    <div class="col-span-1">
                        <mat-form-field appearance="fill" class="w-full">
                            <mat-label>City</mat-label>
                            <input matInput formControlName="city">
                        </mat-form-field>
                    </div>

                    <div class="col-span-1">
                        <mat-form-field appearance="fill" class="w-full">
                            <mat-label>Zip Code</mat-label>
                            <input matInput formControlName="zipCode">
                        </mat-form-field>
                    </div>

                    <div class="col-span-2">
                        <mat-form-field appearance="fill" class="w-full">
                            <mat-label>Phone Number</mat-label>
                            <input matInput formControlName="mobile">
                        </mat-form-field>
                    </div>

                    <div class="col-span-2">
                        <button type="submit" class="w-full"  
                                class="w-full py-6" style="padding: 1.6rem;">
                           Deliver here
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
