<div class="py-10 lg:px-36"> <div class="py-5">
        <h2 class="text-center py-2 text-2xl font-bold uppercase">
            Order Status
        </h2>
    </div>

    <div class="py-10" *ngIf="order">
        <app-address-card [address]="order.shippingAddress" />
    </div>
    
    <div class="space-y-5 py-5 pt-20">
        <ng-container *ngFor="let item of order?.orderItems">
            <div class="rounded-md p-5 lg:flex items-center justify-between border"> 
                <div class="flex items-center">
                    <img 
                        class="w-20 h-20 object-cover object-top"
                        [src]="item.product.imageUrl" 
                        [alt]="item.product.title">
                    
                    <div class="ml-5 space-y-2">
                        <p class="text-lg font-semibold">{{item.product.title}}</p>

                        <p class="opacity-50 text-xs font-semibold space-x-5">
                            <span>Color: Pink</span> <span>Size: {{item.size}}</span>
                        </p>

                        <p class="text-sm">
                            Seller: {{item.product.brand}}
                        </p>
                        
                        <p class="font-bold">
                            ₹{{item.product.discountedPrice}}
                        </p>
                    </div>
                </div>    
            </div>
        </ng-container>
    </div>

</div>
