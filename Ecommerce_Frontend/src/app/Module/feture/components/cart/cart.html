<main class="mt-10">
  <ng-container *ngIf="cart">
    <div class="py-10 lg:grid grid-cols-3 lg:px-16 relative">

      <!-- LEFT SECTION -->
      <section class="lg:col-span-2 lg:px-5">
        <div class="box p-5">
          <div *ngFor="let item of cartItems; let last=last">
            <app-cart-item [cartItem]="item" showButton="true"></app-cart-item>
            <mat-divider *ngIf="!last"></mat-divider>
          </div>
        </div>
      </section>

      <!-- RIGHT SECTION -->
      <section class="px-5 sticky top-0 h-screen mt-5 lg:mt-0">
        <div class="box p-5 rounded-md">
          <p class="font-bold text-gray-500 pb-4">Price Details</p>
          <mat-divider></mat-divider>

          <div class="space-y-3">
            <div class="flex justify-between pt-3">
              <span>Total Price</span>
              <span>6999</span>
            </div>

            <div class="flex justify-between pt-3">
              <span>Discount</span>
              <span class="text-green-700">70</span>
            </div>

            <div class="flex justify-between pt-3">
              <span>Delivery Charges</span>
              <span class="text-green-700">Free</span>
            </div>

            <div class="flex justify-between font-semibold text-lg">
              <span>Total Amount</span>
              <span class="text-green-700">3999</span>
            </div>
          </div>

          <button (click)="navigateToCheckout()"
            style="padding: 1.5rem;"
            class="text-lg mt-8 px-10 w-full"
            color="accent"
            mat-raised-button>
            CHECKOUT
          </button>
        </div>
      </section>

    </div>
  </ng-container>
</main>
