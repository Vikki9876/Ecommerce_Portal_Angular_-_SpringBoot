<div class="flex flex-col items-center " >
  <main class="px-4 sm:px-6  max-w-7xl  pb-10">
    <div class="flex items-baseline justify-between border-gray-200 pb-6 pt-24">
      <h1 class="text-4xl font-bold text-white">Products</h1>
      <div class="flex items-center">
        <div>
          <button mat-button [matMenuTriggerFor]="sortMenu">Sort</button>
          <mat-menu #sortMenu="matMenu">
            <button (click)="handleSingleSelectFilter('price_high','sort')"  mat-menu-item>Price: high-low</button>
            <button (click)="handleSingleSelectFilter('price_low','sort')"  mat-menu-item>Price: low-high</button>
          </mat-menu>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div class="grid grid-cols-1 gap-8 gap-y-10 lg:grid-cols-4 pt-6">
      <div>
        <div class="flex items-center justify-between pb-4">
          <p class="text-lg text-white">Filters</p>
          <mat-icon class="text-white">filter_list</mat-icon>
        </div>

        <form class="hidden lg:block">
          <div *ngFor="let item of filterData; let last = last">
            <div class="py-6">
              <span class="font-medium text-white">{{item.name}}</span>
              <div class="pt-6 space-y-4">
                @for (option of item.options; track option.value) {
                <div class="flex items-center">
                  <mat-checkbox [id]="'filter-' + option.value" [name]="item.id" [value]="option.value" (click)="handleMultipleSelectFilter(option.value,item.id)">
                    <span class="text-sm text-gray-400">{{option.label}}</span>
                  </mat-checkbox>
                </div>
                }
              </div>
            </div>
            <mat-divider></mat-divider>
          </div>

          <div *ngFor="let item of singleFilterData; let last = last">
            <div class="py-6">
              <span class="font-medium text-white">{{item.name}}</span>
              <div class="pt-6">
                <mat-radio-group [name]="item.id" class="flex flex-col space-y-4">
                  @for (option of item.options; track option.value) {
                  <mat-radio-button [id]="'filter-' + option.value" [value]="option.value"  (click)="handleSingleSelectFilter(option.value ,item.id)" >
                    <span class="text-sm text-gray-400">{{option.label}}</span>
                  </mat-radio-button>
                  }
                </mat-radio-group>
              </div>
            </div>
            <mat-divider *ngIf="!last"></mat-divider>
          </div>
        </form>

      </div>

      <div class="lg:col-span-3">
       <div class="flex flex-wrap justify-evenly" >
      
        <ng-container *ngFor="let item of products">
          
          <app-product-card [product]="item" />

        </ng-container>
       
      </div>        
        <!--<div class="text-white">products</div>-->
      </div>
    </div>
  </main>
</div>
