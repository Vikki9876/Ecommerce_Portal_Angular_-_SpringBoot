<div class="p-6">
  <form [formGroup]="loginForm" (ngSubmit)="submitForm()" class="flex flex-col space-y-3">
    
    <h1 class="text-2xl font-bold text-center mb-4 text-gray-800">Create Account</h1>

    <div class="grid grid-cols-2 gap-4">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName">
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password">
    </mat-form-field>

    <div class="pt-4">
      <button mat-raised-button 
              color="accent" 
              type="submit" 
              class="w-full py-7! font-semibold text-lg uppercase tracking-wider shadow-md">
        REGISTER
      </button>
    </div>

    <div class="text-center pt-2 text-sm text-gray-600">
      <span>Already have an account?</span>
      <button mat-button 
              color="accent" 
             (click)="onToggleClick()" 
              type="button" 
              class="font-bold!">
        Login
      </button>
    </div>

  </form>
</div>
