<div class="signin-container p-6">
  <form [formGroup]="loginForm" (ngSubmit)="submitForm()" class="flex flex-col space-y-4">
    
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Shop with Vivek</h1>

    <div class="flex flex-col space-y-2">
      <mat-form-field class="w-full" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid address</mat-error>
      </mat-form-field>

      <mat-form-field class="w-full" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password">
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Minimum 8 characters required</mat-error>
      </mat-form-field>
    </div>

    <div class="pt-4">
      <button mat-raised-button 
              color="accent" 
              class="w-full py-7! font-semibold text-lg uppercase tracking-wider shadow-md"
              type="submit"> 
        Login
      </button>  
    </div>

    <div class="text-center pt-4 text-sm text-gray-600">
      <span>If you don't have an account, </span>
      <button mat-button color="accent" (click)="onToggleClick()" type="button" class="font-bold!">
        Register
      </button>
    </div>

  </form>
</div>
